<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNStudio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="brand">
    <h1>MNStudio</h1>
    <p>By Muhammed</p>
  </div>

  <div class="cards">
    <div class="card">
      <h2>Web sayt</h2>
      <p>Professional sayt hazırlanması.</p>
      <button>Ətraflı bax</button>
    </div>

    <div class="card">
      <h2>Dizayn</h2>
      <p>Müasir və gözəl dizayn.</p>
      <button>Ətraflı bax</button>
    </div>

    <div class="card">
      <h2>Layihəniz var?</h2>
      <p>Sayt hazırlatmaq istəyirsinizsə, mənimlə əlaqə saxlayın.</p>
      <button id="contactBtn">Mənimlə əlaqə</button>
    </div>
  </div>

  <div id="contactModal" class="modal">
    <div class="modal-content">
      <h2>Mənimlə əlaqə saxla</h2>
      <p>İstədiyin platformanı seç:</p>

      <a href="#" target="_blank">WhatsApp</a>
      <a href="#" target="_blank">Instagram</a>

      <button id="closeBtn">Bağla</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
